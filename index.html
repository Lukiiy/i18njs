<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Demo</title>
</head>
<body>
    <nav>
        <button onclick="I18n.set('en')">English</button>
        <button onclick="I18n.set('pt-BR')">Brazilian Portuguese</button>
        <button onclick="I18n.set('es')">Español</button>
    </nav>

    <h1 data-i18n="title">Welcome to the demo</h1>
    <p data-i18n="intro">This is translated with data attributes.</p>
    <input placeholder="Search" title="Type!" data-i18n-attr="placeholder=searchPlaceholder;title=searchTip">
    <button>🔍</button>
    <script src="i18n.js"></script>

    <script type="module">
        I18n.add("pt-BR", {
            title: "Bem-vindo(a) à demonstração",
            intro: "Isso é traduzido com atributos.",
            searchPlaceholder: "Buscar",
            searchTip: "Escreva!"
        });

        I18n.add("es", {
            title: "Bienvenido(a) a la demostración",
            intro: "Esto se traduce con atributos.",
            searchPlaceholder: 'Buscar',
            searchTip: "¡Escribe!"
        });
    </script>
</body>
</html>
